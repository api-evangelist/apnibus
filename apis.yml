name: ApniBus
description: 'ApniBus is an India-based online bus ticket booking platform that lets travelers
  search routes, compare operators, select seats, and pay for tickets across government and
  private bus services. It positions itself as a leading Indian bus-booking marketplace and an
  official RSRTC (Rajasthan State Road Transport Corporation) booking partner, aggregating over
  one lakh bus services across thousands of routes. The consumer experience spans a website and
  Android/iOS apps, with UPI, cards, net banking, and wallet payments, instant e-ticket / m-ticket
  confirmation, live bus tracking, and easy cancellation. ApniBus was surfaced as a portfolio
  company of Version One Ventures and added to the API Evangelist network for enrichment; it
  publishes no public developer or API program at this time.'
